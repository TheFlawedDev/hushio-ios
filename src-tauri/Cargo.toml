[package]
name = "hushio-desktop"
version = "1.0.0"
description = "Hushio, a free music player"
authors = ["Nexvyn"]
license = "GPL-3.0-only"
edition = "2024"

[lib]
name = "hushio_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-hushio-player = { path = "tauri-plugin-hushio-player" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mime_guess = "2"
tauri-plugin-store = "2"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
tokio = { version = "1.54.1", features = ["full"] }
tauri-plugin-http = { version = "2", features = ["unsafe-headers"] }
axum = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "gzip", "cookies"] }
regex = "1.13.1"
md5 = "0.8"
scraper = "0.20"
unicode-normalization = "0.1.26"
lofty = "0.22"
tokio-util = "0.7.20"
sha1 = "0.10"
symphonia = { version = "0.5", features = ["all"] }
chrono = "0.4"
base64 = "0.22"
rand = "0.8"
sha2 = "0.10"
url = "2"
uuid = { version = "1", features = ["v4"] }
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-deep-link = "2.6.3"
tauri-plugin-window-state = "2.5.0"
tauri-plugin-process = "2"
smb = { version = "0.12.1", default-features = false, features = ["sign", "encrypt", "compress", "async"] }
quick-xml = { version = "0.42.0", default-features = false, features = ["encoding"] }
smb-fscc = "0.12.1"
smb-msg = "0.12.1"
futures-util = "0.3"

[target.'cfg(target_os = "ios")'.dependencies]
# Phase B: no iOS-specific Rust dependencies yet. Swift bridge crates (keychain, document
# picker, notifications) land in Phase C/D after they are source-verified. Do not add
# unverified crates here.

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
notify = "8"

[target.'cfg(windows)'.dependencies]
souvlaki = "0.9.3"
keyring = { version = "3", features = ["windows-native"] }
window-vibrancy = "0.8.1"
windows = { version = "0.58", features = ["Win32_UI_Shell", "Win32_Foundation", "Win32_System_Com", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }
souvlaki = "0.9.3"

[target.'cfg(target_os = "linux")'.dependencies]
ashpd = { version = "0.11", default-features = false, features = ["tokio"] }
futures-util = "0.3"
gtk = "0.18"
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
mpris-server = "0.9"
zbus = "5"

[profile.release]
lto = "thin"
opt-level = 3
panic = "abort"
strip = true

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["full", "test-util"] }
